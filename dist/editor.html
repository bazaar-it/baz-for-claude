<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>baz editor</title>
<style>
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body { background: #17191D; color: #E8E4DA; font: 13px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif; }
  .app { display: flex; height: 100%; }
  .side { width: 230px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,.1); padding: 12px; overflow-y: auto; background: #121417; }
  .brand { font-family: Georgia, serif; font-style: italic; font-size: 19px; margin-bottom: 2px; }
  .brand span { opacity: .5; font-size: 14px; }
  .proj { font-size: 11px; color: #8A8377; margin-bottom: 12px; }
  .scene { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: #C9C3B6; padding: 6px 8px; border-radius: 6px; font: inherit; cursor: pointer; }
  .scene:hover { background: rgba(255,255,255,.06); }
  .scene.on { background: rgba(95,211,148,.14); color: #7BE5A4; border-color: rgba(95,211,148,.3); }
  .scene.nocode { opacity: .35; }
  .scene i { font-style: normal; font-size: 10px; color: #8A8377; margin-right: 4px; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 14px; gap: 10px; }
  .bar { display: flex; align-items: center; gap: 16px; font-size: 12px; color: #A9A296; }
  .bar .sel { color: #7BE5A4; }
  .crumbs { display: flex; align-items: center; gap: 6px; }
  .crumbs b { color: #7BE5A4; font-weight: 600; margin-right: 4px; }
  .crumb { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: #C9C3B6; border-radius: 5px; padding: 2px 8px; font: inherit; font-size: 11.5px; cursor: pointer; }
  .crumb.on { background: rgba(95,211,148,.18); color: #7BE5A4; border-color: rgba(95,211,148,.45); }
  .crumbs .hint { font-style: normal; font-size: 10.5px; color: #6f695e; margin-left: 6px; }
  .bar .status { margin-left: auto; }
  .stage { position: relative; width: 100%; flex: 1 1 auto; min-height: 120px; background: #000; border-radius: 8px; overflow: hidden; }
  .hit-overlay { position: absolute; inset: 0; cursor: crosshair; z-index: 10; }
  .selbox { position: absolute; border: 1.5px solid #5FD394; box-shadow: 0 0 0 1px rgba(0,0,0,.6); pointer-events: none; z-index: 11; }
  .selhandle { position: absolute; width: 10px; height: 10px; background: #5FD394; border: 1.5px solid #0b2018; border-radius: 2px; z-index: 12; touch-action: none; }
  .baz-editing { outline: 2px dashed #5FD394 !important; outline-offset: 2px; cursor: text; }
  .hit-overlay.pass { pointer-events: none; }
  .brandmini { font-family: Georgia, serif; font-style: italic; font-size: 15px; color: #F0EBE0; }
  .projmini { color: #8A8377; font-size: 11.5px; margin-right: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .transport { display: flex; align-items: center; gap: 12px; }
  .play { width: 44px; height: 32px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #E8E4DA; border-radius: 7px; font: inherit; cursor: pointer; }
  .play:hover { background: rgba(255,255,255,.15); }
  .hbtn { width: 34px; height: 32px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: #E8E4DA; border-radius: 7px; font: inherit; cursor: pointer; }
  .hbtn:hover:not(:disabled) { background: rgba(255,255,255,.14); }
  .hbtn:disabled { opacity: .3; cursor: default; }
  .tl { position: relative; width: 100%; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 9px; overflow: hidden; touch-action: none; user-select: none; cursor: default; }
  .tl-ruler { position: absolute; top: 0; left: 0; right: 0; height: 20px; background: rgba(0,0,0,.25); cursor: pointer; }
  .tl-row { position: absolute; left: 0; right: 0; height: 34px; border-top: 1px solid rgba(255,255,255,.06); }
  .tl-tracklabel { position: absolute; left: 6px; top: 8px; font-size: 10px; color: #6f695e; font-family: ui-monospace, monospace; pointer-events: none; }
  .tl-clip { position: absolute; background: rgba(123,229,164,.16); border: 1px solid rgba(123,229,164,.35); border-radius: 6px; overflow: hidden; cursor: grab; display: flex; align-items: center; transition: left .16s ease, top .16s ease; }
  .tl-clip:hover { background: rgba(123,229,164,.24); }
  .tl-clip.on { background: rgba(123,229,164,.32); border-color: #5FD394; }
  .tl-clip.ghosting { opacity: .85; border-style: dashed; cursor: grabbing; transition: none; z-index: 4; }
  .tl-label { flex: 1; font-size: 11px; color: #DDEEDD; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .tl-clip .hL, .tl-clip .hR { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
  .tl-clip .hL { left: 0; border-left: 2px solid rgba(123,229,164,.55); }
  .tl-clip .hR { right: 0; border-right: 2px solid rgba(123,229,164,.55); }
  .tl-head { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #5FD394; box-shadow: 0 0 6px #5FD394; pointer-events: none; z-index: 5; }
  .tc { font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: 15px; }
  .pad { padding: 30px; }
  .err { color: #ff8a8a; font-family: monospace; }
  .dim { color: #8A8377; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/dist/editor.js"></script>
</body>
</html>
